name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: OpenAPI document is up to date
        run: git diff --exit-code -- openapi/
      - name: No pending model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/AlMostafa.Infrastructure --startup-project src/AlMostafa.API

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript API types match the backend OpenAPI contract
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
