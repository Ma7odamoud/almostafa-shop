<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132240" />
      <stop offset="100%" stop-color="#0a1526" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sbg)" />

  <!-- Tailor measurement showroom sketch -->
  <g opacity="0.4" stroke="#c9a84c" stroke-width="1.5" fill="none">
    <!-- Mannequin / Client torso -->
    <path d="M400 140 Q400 180 340 220 L320 450 L480 450 L460 220 Q400 180 400 140 Z" stroke-width="2" />
    <!-- Measuring tape across shoulders -->
    <path d="M310 220 Q400 245 490 220" stroke="#c9a84c" stroke-width="2.5" stroke-dasharray="6 3" />
    <!-- Measuring tape vertical -->
    <line x1="400" y1="180" x2="400" y2="450" stroke="#c9a84c" stroke-dasharray="4 4" />
    <!-- Fabric bolts on shelf behind -->
    <rect x="120" y="160" width="100" height="240" rx="4" />
    <line x1="145" y1="160" x2="145" y2="400" stroke-dasharray="4 4" />
    <line x1="170" y1="160" x2="170" y2="400" stroke-dasharray="4 4" />
    <line x1="195" y1="160" x2="195" y2="400" stroke-dasharray="4 4" />
    <!-- Mirror frame on right -->
    <rect x="580" y="120" width="120" height="340" rx="4" stroke-width="2" />
  </g>

  <!-- Label -->
  <text x="400" y="520" fill="#c9a84c" text-anchor="middle" font-size="16" font-family="'Tajawal', sans-serif" opacity="0.8">⚠️ صورة المحل وتفصيل القياسات — يرجى إضافة الصورة الحقيقية</text>
  <text x="400" y="550" fill="#8fa0b8" text-anchor="middle" font-size="13" font-family="sans-serif" opacity="0.7">Place showroom.jpg in /public/assets/showroom/</text>
</svg>
